<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Filmes, séries e TV ao vivo para Android TV, celular e computador.">
  <title>CineFlow</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Cine<span>Flow</span></div>
    <nav class="nav" id="nav">
      <button class="nav-btn focusable" data-view="home">Início</button>
      <button class="nav-btn focusable" data-view="movies">Filmes</button>
      <button class="nav-btn focusable" data-view="series">Séries</button>
      <button class="nav-btn focusable" data-view="live">TV ao vivo</button>
      <button class="nav-btn focusable" data-view="favorites">Minha lista</button>
      <button class="nav-btn focusable" data-view="settings">Ajustes</button>
    </nav>
    <input id="search" class="search focusable" type="search" placeholder="Buscar…" aria-label="Buscar">
  </header>

  <main id="main" tabindex="-1"></main>

  <div id="details" class="modal" hidden role="dialog" aria-modal="true"></div>

  <div id="player" class="player" hidden>
    <video id="video" playsinline controls></video>
    <div class="player-bar">
      <button id="player-close" class="focusable player-btn" aria-label="Voltar">← Voltar</button>
      <div id="player-title" class="player-title"></div>
      <button id="player-next" class="focusable player-btn" hidden>Próximo episódio →</button>
    </div>
    <div id="player-msg" class="player-msg" hidden></div>
  </div>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
